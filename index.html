<!doctype html>
<!-- SPDX-License-Identifier: EUPL-1.2 -->
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-MR9XK5qaS31yXuhgTzqvBOojL7ihSPNjrrpFcSrgk/I=' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H8XL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --raised:#FFFFFF; --phase:#F7F8FB; --ink:#121722; --muted:#5D6876; --line:#E1E6ED; --line-strong:#CBD3DD;
  --weekend:#F1F3F7; --holiday:#E7EAF3; --sel:#EEF0FD; --today:#E0533F; --focus:#4F5BD5; --hover:#F1F3F7; --pn:#6E7987; --amber:#B7791F;
  --p0:#4F5BD5; --p1:#1E9C77; --p2:#C98A12; --p3:#9A55D8; --p4:#1E8FB8; --p5:#D9594A;
  --shadow:0 1px 2px rgba(18,23,34,.06),0 12px 32px rgba(18,23,34,.10); --glow:0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1015; --surface:#141921; --raised:#1A2029; --phase:#171C24; --ink:#E7ECF2; --muted:#919DAB; --line:#232B36; --line-strong:#2E3845;
    --weekend:#181D25; --holiday:#1E2431; --sel:#1C2136; --today:#FF7A66; --focus:#8A98FF; --hover:#202733; --pn:#7D8896; --amber:#F2B653;
    --p0:#8A98FF; --p1:#45C7A0; --p2:#F2B653; --p3:#C98CFA; --p4:#5BC0EB; --p5:#FF8F7A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.45); --glow:1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1015; --surface:#141921; --raised:#1A2029; --phase:#171C24; --ink:#E7ECF2; --muted:#919DAB; --line:#232B36; --line-strong:#2E3845;
  --weekend:#181D25; --holiday:#1E2431; --sel:#1C2136; --today:#FF7A66; --focus:#8A98FF; --hover:#202733; --pn:#7D8896; --amber:#F2B653;
  --p0:#8A98FF; --p1:#45C7A0; --p2:#F2B653; --p3:#C98CFA; --p4:#5BC0EB; --p5:#FF8F7A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.45); --glow:1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:16px 24px 14px}
.brand{display:flex;align-items:center;gap:9px;font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-weight:500;font-size:14px;letter-spacing:.06em;white-space:nowrap}
.brand .glyph{width:18px;height:18px;border-radius:5px;background:var(--focus);box-shadow:0 0 calc(var(--glow)*16px) color-mix(in srgb,var(--focus) 60%,transparent)}
.top .vsep{width:1px;height:20px;background:var(--line)}
.title-in{flex:1 1 260px;min-width:0;border:1px solid transparent;border-radius:9px;background:transparent;padding:4px 8px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.title-in:hover{border-color:var(--line)}
.title-in:focus{border-color:var(--line-strong);outline:none;background:var(--paper)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--raised);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--line-strong)}
.btn.primary{background:var(--focus);color:var(--paper);border-color:var(--focus);font-weight:600}
.btn.primary:hover{background:var(--focus);filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--surface);height:34px}
.seg button{border:0;border-radius:8px;background:transparent;padding:0 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:40px;min-width:240px;background:var(--raised);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:50;display:none}
.menu.open{display:block}
.menu button,.menu label{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;font-size:14px}
.menu button:hover,.menu label:hover{background:var(--hover)}
.menu small{display:block;color:var(--muted);font-size:12px}
.menu input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);margin:0}
.sep{width:1px;height:22px;background:var(--line-strong);margin:0 2px}

main{padding:4px 24px 40px;max-width:100%}
.board{position:relative;display:flex;gap:16px;align-items:flex-start}
.board .gantt{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.panel{width:330px;flex:none;border:1px solid var(--line);border-radius:16px;background:var(--raised);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 150px);min-height:260px;display:none;padding:16px 18px 18px}
.mode-panel .panel{display:block}
.panel{transition:width .18s ease,padding .18s ease}
.panel.collapsed{width:48px;padding:6px;min-height:0;overflow:hidden}
.p-tools{display:flex;gap:2px}
.p-x{display:inline-flex;align-items:center;justify-content:center}
.p-rail{width:100%;min-height:180px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0;border-radius:10px}
.p-rail:hover{background:var(--hover);color:var(--ink)}
.p-rail-txt{writing-mode:vertical-rl;font-size:13px;font-weight:500;max-height:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-rail-dot{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 calc(var(--glow)*8px) currentColor}
.p-kind{display:inline-flex;align-items:center;gap:8px}
.p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.p-kind{font-size:12px;color:var(--muted);font-weight:500}
.p-x{border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:6px}
.p-x:hover{background:var(--hover);color:var(--ink)}
.p-name{width:calc(100% + 6px);font-size:18px;font-weight:600;letter-spacing:-.01em;border:1px solid transparent;border-radius:8px;padding:4px 6px;background:transparent;margin:0 0 8px -6px}
.p-name:hover{border-color:var(--line)}
.p-name:focus{border-color:var(--line-strong);outline:none;background:var(--paper)}
.p-sec{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:10px}
.p-sec h4{margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.p-row{display:flex;flex-direction:column;gap:4px;min-width:0}
.p-row label{font-size:12px;color:var(--muted)}
.panel input[type=text],.panel input[type=date],.panel input[type=number],.panel select{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:0 8px;font-size:14px;min-width:0}
.panel input:focus,.panel select:focus{outline:none;border-color:var(--focus)}
.p-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-ro{font-size:13px;color:var(--muted)}
.p-check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;width:max-content}
.p-check input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.p-inline{display:flex;gap:6px}
.btn.sm{height:34px;padding:0 10px;font-size:13px;flex:none}
.btn.danger{color:var(--today)}
.p-gap{margin:0;font-size:13px;color:var(--muted)}
.p-gap.over{color:var(--amber);font-weight:500;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--amber) 11%,transparent);border:1px solid color-mix(in srgb,var(--amber) 32%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 3px 0 10px;border:1px solid var(--line);background:var(--paper);border-radius:14px;font-size:13px;max-width:100%}
.chip-n{color:var(--muted);font-size:12px}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.chip button{border:0;background:none;width:22px;height:22px;border-radius:11px;cursor:pointer;color:var(--muted);font-size:14px;padding:0}
.chip button:hover{background:var(--hover);color:var(--ink)}
.p-acts{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.p-empty{color:var(--muted);font-size:14px;padding:6px 2px}
.p-empty strong{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:4px}
.p-empty p{margin:0}
.nw{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.lr.selected{background:var(--sel)}
.lr.selected .num{color:var(--focus)}
.labels .lr .del,.labels .lr .mini{display:none}
.labels .lr.selected .del,.labels .lr.selected .mini{display:inline-flex;align-items:center;justify-content:center;opacity:1;pointer-events:auto}
.labels .lr.selected .del:hover{color:var(--today)}
.grip{display:none;flex:none;width:16px;height:26px;margin:0 -6px 0 -12px;border:0;border-radius:5px;background:none;color:var(--muted);cursor:grab;touch-action:none;padding:0;align-items:center;justify-content:center}
.grip:hover{color:var(--ink);background:var(--hover)}
.lr.selected .grip{display:inline-flex}
.lr.row-lift{position:relative;z-index:6;background:var(--raised)!important;box-shadow:var(--shadow);pointer-events:none}
.drop-line{position:absolute;left:8px;right:8px;height:2px;margin-top:-1px;background:var(--focus);border-radius:1px;pointer-events:none;box-shadow:0 0 calc(var(--glow)*8px) var(--focus);display:none;z-index:7}
.drop-line span{position:absolute;right:0;top:-10px;font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;background:var(--focus);color:var(--paper);white-space:nowrap}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast-act{border:0;background:transparent;color:inherit;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0}
@media (max-width:720px){
  .mode-panel .panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:64vh;min-height:0;border-left:0;border-top:1px solid var(--line-strong);border-radius:16px 16px 0 0;box-shadow:var(--shadow);z-index:60;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .mode-panel .panel.empty{display:none}
  .mode-panel .panel.collapsed{left:auto;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;max-height:none;border-radius:22px;padding:0;border:1px solid var(--line-strong)}
  .p-rail{flex-direction:row;min-height:44px;padding:0 16px;gap:8px}
  .p-rail-txt{writing-mode:horizontal-tb;max-width:200px}
}

/* Gantt grid */
.gantt{display:grid;grid-template-rows:48px auto;overflow:auto;max-height:calc(100vh - 230px);min-height:260px;position:relative;overscroll-behavior:contain}
.corner{position:sticky;top:0;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line-strong);display:flex;align-items:flex-end;gap:8px;padding:0 8px 8px 14px;overflow:hidden;font-size:13px;color:var(--muted);font-weight:500}
.hdr{position:sticky;top:0;z-index:3;background:var(--surface);display:block}
.labels{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
#body{display:block;user-select:none;-webkit-user-select:none}
.lr{position:relative;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;border-bottom:1px solid var(--line)}
.r-phase{height:32px;background:var(--phase)}
.r-task{height:36px}
.r-sub{height:30px;gap:6px}
.r-sub .num{width:30px}
.r-sub .name-in{font-size:13.5px;color:var(--muted)}
.r-sub .name-in:focus{color:var(--ink)}
.tg{flex:none;width:18px;height:22px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:5px;font-size:12px;padding:0;margin-right:-4px}
.tg:hover{background:var(--hover);color:var(--ink)}
.tg-sp{flex:none;width:14px}
.r-task:not(.r-sub) .tg-sp{width:18px;margin-right:-4px}
.cnt{flex:none;font-size:11px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:0 6px;line-height:16px}
.mini{flex:none;width:22px;height:22px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;opacity:0;font-size:14px;line-height:1;padding:0}
.lr.selected .mini,.mini:focus-visible{opacity:1}
.mini:hover{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mini.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.r-empty{height:72px;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;font-size:13px;color:var(--muted)}
.r-empty strong{color:var(--ink);font-weight:600;font-size:14px}
.r-add{height:48px;border-bottom:0;gap:0;padding-left:6px;overflow:hidden}
.ph-add{flex:none;width:24px;height:24px;margin-left:auto;border:1px solid var(--line);border-radius:7px;background:var(--raised);color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ph-add:hover{color:var(--ink);border-color:var(--line-strong)}
.sw{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 calc(var(--glow)*10px) currentColor}
.num{width:22px;flex:none;color:var(--muted);font-size:11px;text-align:right;font-family:"Geist Mono",ui-monospace,Menlo,monospace}
.name-in,.phase-in{flex:1;min-width:0;border:1px solid transparent;border-radius:6px;background:transparent;padding:3px 6px;font-size:14px}
.phase-in{font-weight:600;font-size:13px}
.name-in:hover,.phase-in:hover{border-color:var(--line)}
.name-in:focus,.phase-in:focus{border-color:var(--line-strong);background:var(--surface);outline:none}
.name-in::placeholder{color:var(--muted);opacity:.8}
.del{flex:none;width:24px;height:24px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;opacity:0;font-size:16px;line-height:1}
.labels .del,.labels .mini{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.labels .del{right:2px;background:var(--sel)}
.labels .mini{right:30px}
.labels .lr.selected .del,.labels .lr.selected .mini{pointer-events:auto}
.labels .lr.selected .name-in{padding-right:58px}
.lr.selected .del,.del:focus-visible{opacity:1}
.del:hover{background:var(--hover);color:var(--today)}

.add{border:0;background:none;padding:6px 8px;white-space:nowrap;border-radius:7px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.add:hover{background:var(--hover)}
.add .plus{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.add.sub{font-weight:500;color:var(--muted)}

/* SVG parts */
.bar{cursor:grab;touch-action:none}
.task.dragging .bar{cursor:grabbing}
.handle{cursor:ew-resize;touch-action:none}
.dot{cursor:crosshair;opacity:0;transition:opacity .12s;touch-action:none}
.task:hover .dot,.task.dragging .dot,.task.sel .dot{opacity:1}
@media (hover:none){.dot{opacity:.75}}
.task.snapped .bar{stroke:var(--ink);stroke-width:2}
.task.link-target .bar{stroke:var(--focus);stroke-width:2.5}
.arrow{cursor:pointer}
.flag{cursor:ew-resize;touch-action:none}
.flag:hover line,.flag:hover path{stroke:var(--focus);fill:var(--focus)}
.arrow .hit{stroke:transparent;stroke-width:12;fill:none}
.arrow:hover .vis{stroke:var(--today)!important;stroke-width:2}
.tmp{pointer-events:none}

.tip{position:absolute;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;display:none;box-shadow:var(--shadow)}
.tip b{font-weight:600}
.tip .warn{display:block;opacity:.85;margin-top:2px}

.hint{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;margin:12px 2px 0;color:var(--muted);font-size:13px}
.hint p{margin:0;max-width:78ch}
.hint a{color:var(--muted);text-underline-offset:3px}
.hint a:hover{color:var(--ink)}
.fb-kinds{display:flex;flex-wrap:wrap;gap:8px;border:0;margin:0 0 14px;padding:0}
.fb-kinds legend{font-size:12px;color:var(--muted);margin-bottom:6px;padding:0}
.fb-kinds label{position:relative}
.fb-kinds input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.fb-kinds span{display:inline-flex;align-items:center;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:16px;font-size:13.5px;cursor:pointer;background:var(--paper)}
.fb-kinds input:checked+span{border-color:var(--focus);color:var(--ink);background:var(--sel)}
.fb-kinds input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.fb-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.fb-field input,.fb-field textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:8px 10px;font-size:14px;color:var(--ink)}
.modal .fb-field textarea{min-height:130px;resize:vertical;font-family:inherit;white-space:pre-wrap;font-size:14px;background:var(--paper)}
.fb-field input:focus,.fb-field textarea:focus{outline:none;border-color:var(--focus)}
.fb-note{font-size:12.5px;color:var(--muted);margin:2px 0 0}


/* Modal & toast */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ov.open{display:flex}
.modal{background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);padding:22px;max-height:90%;overflow:auto}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.modal p{margin:0 0 14px;color:var(--muted);font-size:14px;max-width:62ch}
.modal textarea{width:100%;min-height:180px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--paper);resize:vertical;white-space:pre;tab-size:16}
.modal .acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200;max-width:min(560px,calc(100% - 32px))}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:720px){
  .top{padding:12px 14px}
  main{padding:14px 12px 32px}
  .title-in{font-size:19px;flex-basis:100%;order:2}
  .brand{order:1}
  .tools{order:3}
  .gantt{max-height:calc(100vh - 300px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" aria-label="H8XL"><span class="glyph" aria-hidden="true"></span>H8XL</div>
  <span class="vsep" aria-hidden="true"></span>
  <input class="title-in" id="title" aria-label="Titel">
  <div class="tools">

const T = k => I[S.lang][k];

/* ---------- dates (day numbers, UTC) ---------- */
const DAY = 86400000;
const dnOf = (y,m,d) => Math.round(Date.UTC(y,m-1,d)/DAY);
const ymd = dn => { const d = new Date(dn*DAY); return [d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()]; };
const wd = dn => (((dn+4)%7)+7)%7; // 0 = Sunday
const todayDn = () => { const n = new Date(); return dnOf(n.getFullYear(), n.getMonth()+1, n.getDate()); };
const monday = dn => dn - ((wd(dn)+6)%7);
const isoDate = dn => { const [y,m,d]=ymd(dn); return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); };
function isoWeek(dn){ const th = dn + 3 - ((wd(dn)+6)%7); const y = ymd(th)[0]; return 1 + Math.floor((th - dnOf(y,1,1))/7); }
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return dnOf(y,mo,da);}
const holCache = new Map();
function holYear(y){
  if (holCache.has(y)) return holCache.get(y);
  const m = new Map(), e = easter(y);
  m.set(dnOf(y,1,1),"newyear"); m.set(e,"easter1"); m.set(e+1,"easter2");
  let kd = dnOf(y,4,27); if (wd(kd)===0) kd -= 1; m.set(kd,"kings");
  if (y%5===0) m.set(dnOf(y,5,5),"liberation");
  m.set(e+39,"ascension"); m.set(e+49,"pent1"); m.set(e+50,"pent2");
  m.set(dnOf(y,12,25),"xmas1"); m.set(dnOf(y,12,26),"xmas2");
  holCache.set(y,m); return m;

const nextWork = dn => { let i=0; while (isOff(dn) && i++<60) dn++; return dn; };
const prevWork = dn => { let i=0; while (isOff(dn) && i++<60) dn--; return dn; };

/* ---------- state ---------- */
const KEY = "planbord.v1";

const uid = () => Math.random().toString(36).slice(2,10);
const byId = id => S.tasks.find(t=>t.id===id);

function sample(lang){
  const nl = lang==="nl";
  const P = nl ? ["Voorbereiding","Ontwerp","Uitvoering","Oplevering"] : ["Preparation","Design","Build","Delivery"];
  const N = nl ? ["Kick-off","Wensen inventariseren","Schetsontwerp","Feedbackronde klant","Akkoord ontwerp","Bouwen","Content aanleveren","Testen","Livegang","Basis opzetten","Pagina\u2019s uitwerken","Interne review"]
               : ["Kick-off","Gather requirements","Concept design","Client feedback round","Design approved","Build","Deliver content","Testing","Go-live","Set up foundation","Build out pages","Internal review"];
  const client = nl ? "Klant" : "Client";
  const s0 = nextWork(monday(todayDn())+7);
  const ids = N.map(()=>uid());
  const mk = (i,ph,dur,ms,after,owner,prog,start,parent) => ({id:ids[i],name:N[i],phase:P[ph],start:start??s0,dur,ms,deps:after==null?[]:[{id:ids[after],lag:0}],owner,progress:prog,parent:parent==null?null:ids[parent],collapsed:false});
  return [
    mk(0,0,1,false,null,"Sanne",100),
    mk(1,0,4,false,0,"Sanne",60),
    mk(2,1,5,false,1,"Daan",0),
    mk(3,1,3,false,2,client,0),
    mk(4,1,1,true,3,"",0),
    mk(5,2,10,false,4,"Daan",0),
    mk(9,2,3,false,null,"Daan",0,null,5),

    mk(11,2,2,false,10,"Sanne",0,null,5),
    mk(6,2,8,false,null,client,0,nextWork(s0+14)),
    mk(7,3,4,false,5,"Sanne",0),
    mk(8,3,1,true,7,"",0)
  ];
}

function load(){

  S.tasks = sample(S.lang);
  normalize(); schedule();
  const ms = S.tasks.filter(t=>t.ms);
  const nl = S.lang==="nl";
  if (ms[0]){ ms[0].deliv = nl?"Goedgekeurd schetsontwerp":"Approved concept design"; ms[0].agreed = addWork(ms[0].start,2); }
  if (ms[1]){ ms[1].deliv = nl?"Werkende website":"Working website"; ms[1].agreed = subWork(ms[1].start,3); }
}

/* ---------- model ---------- */
function kidsOf(id){ return S.tasks.filter(t=>t.parent===id); }

function normalize(){
  const ids = new Set(S.tasks.map(t=>t.id));

    if (!t.parent || t.parent===t.id || !ids.has(t.parent)) t.parent = null;
    t.collapsed = !!t.collapsed;
  }
  for (let i=0;i<3;i++) for (const t of S.tasks) if (t.parent){ const p=byId(t.parent); if (p.parent) t.parent=p.parent; }
  const kidMap = new Map();
  for (const t of S.tasks) if (t.parent){ if (!kidMap.has(t.parent)) kidMap.set(t.parent,[]); kidMap.get(t.parent).push(t); }
  for (const t of S.tasks){
    if (t.parent) t.phase = byId(t.parent).phase;
    t.phase = (t.phase||"").trim();
    t.deps = (t.deps||[]).filter(d=>d && d.id!==t.id && ids.has(d.id) && d.id!==t.parent && byId(d.id).parent!==t.id);

  const order=[], groups=new Map();
  for (const t of S.tasks){

    groups.get(t.phase).push(t);

function baseAfter(p, tMs){ const f = fin(p); return (tMs && !p.ms) ? f : nextWork(f+1); }
// returns list of activities that had to be extended for their sub-activities
function schedule(){
  const sDone=new Map(), fDone=new Set(), vis=new Set(), ext=[];
  const startOf = t => {
    if (sDone.has(t.id)) return sDone.get(t.id);
    if (vis.has(t.id)) return t.start;
    vis.add(t.id);
    let s = t.deps.length ? -Infinity : nextWork(t.start);
    for (const d of t.deps){ const p=byId(d.id); full(p); const e=addWork(baseAfter(p,t.ms), d.lag||0); if (e>s) s=e; }
    if (t.parent){ const ps = startOf(byId(t.parent)); if (s<ps) s=ps; }
    vis.delete(t.id); sDone.set(t.id,s); t.start=s; return s;
  };
  const full = t => {
    if (fDone.has(t.id)) return;
    startOf(t); fDone.add(t.id);
    const ch = kidsOf(t.id);
    if (ch.length){
      let mx=-Infinity; for (const c of ch){ full(c); mx=Math.max(mx, fin(c)); }
      if (mx>fin(t)){ t.dur = workCount(t.start, mx); ext.push(t); }
    }
  };
  for (const t of S.tasks) full(t);

}
// limits for a start date: lower bound (predecessors / activity start) and upper bound (activity end)
function limits(t){
  let lo=-Infinity, loBy=null, loKind=null, hi=Infinity, par=null;
  for (const d of t.deps){ const p=byId(d.id); const b=baseAfter(p,t.ms); if (b>lo){ lo=b; loBy=p; loKind="dep"; } }
  if (t.parent){
    par = byId(t.parent);
    if (par.start>lo){ lo=par.start; loBy=par; loKind="within"; }
    hi = t.ms ? fin(par) : subWork(fin(par), Math.max(1,t.dur)-1);
    if (hi<par.start) hi=par.start;
  }
  return {lo,loBy,loKind,hi,par};
}
// set a desired start; returns {kind, by} when it had to snap to a limit
function setStart(t, D){
  D = nextWork(D);
  const c = limits(t); let info=null;
  if (D<c.lo){ D=c.lo; info={kind:c.loKind, by:c.loBy}; }
  if (D>c.hi){ D=c.hi; info={kind:"within", by:c.par}; }
  if (!t.deps.length){ t.start = D; return info; }
  const pinnedByParent = c.par && D===c.par.start;
  for (const d of t.deps){
    const p = byId(d.id); const b = baseAfter(p, t.ms);
    d.lag = (!pinnedByParent && D>=b) ? workCount(b,D)-1 : 0;

// move an activity and carry its sub-activities along
function kidOffsets(t){ return kidsOf(t.id).filter(c=>!c.deps.length).map(c=>[c, Math.max(0, workCount(t.start, c.start)-1)]); }
function moveActivity(t, D, offs){
  const info = setStart(t, D); schedule();

// would linking src -> tgt create a loop? (start/finish graph incl. activity–sub-activity relations)
function wouldCycle(src, tgt){
  if (src.id===tgt.id || src.parent===tgt.id || tgt.parent===src.id) return true;
  const seen=new Set(), st=[["F",src.id]];
  while (st.length){
    const [k,id]=st.pop(), key=k+id; if (seen.has(key)) continue; seen.add(key);
    if (k==="S" && id===tgt.id) return true;
    const t=byId(id); if (!t) continue;
    if (k==="F"){ st.push(["S",id]); for (const c of S.tasks) if (c.parent===id) st.push(["F",c.id]); }
    else { for (const d of t.deps) st.push(["F",d.id]); if (t.parent) st.push(["S",t.parent]); }

}
function addDep(src, tgt){
  if (src.id===tgt.id || tgt.deps.some(d=>d.id===src.id)) return;
  if (wouldCycle(src, tgt)) { toast(T("cycle")); return; }
  const D = tgt.start; tgt.deps.push({id:src.id, lag:0}); setStart(tgt, D);
}
function gapInfo(t){
  if (!t.ms || t.agreed==null) return null;
  const a=t.agreed, f=t.start;
  if (f===a) return {k:"on",n:0};
  return f<a ? {k:"slack",n:workCount(f+1,a)} : {k:"over",n:workCount(a+1,f)};
}
function depsStr(t, num){ return t.deps.map(d=>num.get(d.id)+(d.lag?"+"+d.lag:"")).join(", "); }

/* ---------- layout ---------- */
let L = null;
const isMob = () => matchMedia("(max-width:720px)").matches;
function LW(){ return isMob()?170:300; }

function buildRows(){
  const rows=[], num=new Map(); let n=0, pi=-1, cur=null, ph=null, k=0, parentRow=null;
  const hasPhases = S.tasks.some(t=>t.phase!=="");
  const kidCount = new Map(); for (const t of S.tasks) if (t.parent) kidCount.set(t.parent,(kidCount.get(t.parent)||0)+1);
  const hidden = new Map();
  for (const t of S.tasks){
    if (!t.parent && t.phase!==cur){
      cur=t.phase; ph=null;
      if (cur!==""){ pi++; ph={type:"phase",name:cur,ci:pi%6,tasks:[]}; rows.push(ph); }
      else if (hasPhases){ ph={type:"phase",name:"",ci:null,tasks:[]}; rows.push(ph); }
    }
    const ci = cur==="" ? null : pi%6;
    if (ph) ph.tasks.push(t);
    if (!t.parent){
      n++; k=0; num.set(t.id,String(n));
      parentRow = {type:"task",t,n:String(n),ci,sub:false,kids:kidCount.get(t.id)||0};
      rows.push(parentRow);
    } else {
      k++; const nn = n+"."+k; num.set(t.id,nn);
      const p = byId(t.parent);
      if (p.collapsed) hidden.set(t.id, p.id);
      else rows.push({type:"task",t,n:nn,ci,sub:true,kids:0});
    }
  }
  return {rows,num,hidden};
}
function computeLayout(keepRange){
  const {rows,num,hidden} = buildRows(); const px = S.zoom==="day" ? 34 : 14;
  let rs, re;
  if (keepRange && L){ rs=L.rs; re=L.re; }
  else {
    if (S.tasks.length){ let mn=Infinity,mx=-Infinity; for (const t of S.tasks){ mn=Math.min(mn,t.start); mx=Math.max(mx,fin(t)); if (t.ms && t.agreed!=null){ mn=Math.min(mn,t.agreed); mx=Math.max(mx,t.agreed); } } rs=monday(mn)-7; re=monday(mx)+6+21; }
    else { const td=todayDn(); rs=monday(td)-7; re=monday(td)+6+42; }
    const g = document.getElementById("gantt"); const minW = (g.clientWidth||1000) - LW() - 2;
    while ((re-rs+1)*px < minW) re += 7;
  }
  let y=0; const pos=new Map();
  for (const r of rows){ r.y=y; r.h = r.type==="phase"?32:(r.sub?30:36); if (r.type==="task") pos.set(r.t.id,r); y+=r.h; }
  for (const [id,pid] of hidden) pos.set(id, pos.get(pid));
  const rowsH = y, emptyH = S.tasks.length?0:72;
  L = {rows,num,rs,re,px,W:(re-rs+1)*px,rowsH,H:rowsH+emptyH+48,pos};
}

/* ---------- SVG rendering (screen + export share this) ---------- */

const colFn = mode => mode==="export" ? (k=>LIT[k]) : (k=>"var(--"+k+")");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function headerSVG(mode, rs, re, px, x0, y0){

  }

    if (w>36) s += `<text x="${x+8}" y="${y0+16}" font-size="12" font-weight="600" style="fill:${C("ink")}">${esc(fmt(d, w>120?{month:"long",year:"numeric"}:{month:"short"}))}</text>`;

function arrowPath(p, t, X, px, y0){

  const sy=y0+pr.y+pr.h/2, ty=y0+tr.y+tr.h/2;

function bodySVG(mode, o){

let firstPaint = true;
function renderAll(focusKey){
  const ae=document.activeElement;
  const key = focusKey || (ae && ae.dataset && ae.dataset.f) || null;
  const sel = (!focusKey && ae && ae.type==="text") ? [ae.selectionStart, ae.selectionEnd] : null;
  const keepVal = (!focusKey && ae && ae.type==="text" && ae.dataset && ae.dataset.f) ? ae.value : null;
  normalize(); const ext = schedule(); computeLayout(false);
  if (selId && !byId(selId)) selId=null;
  paintGantt(); paintPanel(); paintChrome(); save();
  if (ext.length && !firstPaint) toast(T("extended")(ext[0].name||T("newTask")));
  if (key){
    const el = document.querySelector(`[data-f="${CSS.escape(key)}"]`);
    if (el){ if (keepVal!==null) el.value = keepVal; el.focus({preventScroll:!focusKey}); if (sel) try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} }
  }

const queue = () => setTimeout(()=>renderAll(),0);

/* ---------- task actions ---------- */
function newTaskAfter(ref, phase){
  const anchor = ref && !ref.parent ? (kidsOf(ref.id).at(-1) || ref) : ref;
  const base = ref && !ref.parent ? ref : (ref && ref.parent ? byId(ref.parent) : null);
  const start = base ? nextWork(fin(base)+1) : nextWork(todayDn());
  const t = {id:uid(), name:"", phase: phase!==undefined ? phase : (base?base.phase:""), start, dur:5, ms:false, deps:[], owner:"", progress:0, parent:null, collapsed:false};
  const i = anchor ? S.tasks.indexOf(anchor)+1 : S.tasks.length;
  S.tasks.splice(i,0,t); return t;
}
function newSubAfter(p, ref){
  const sibs = kidsOf(p.id); const after = ref || sibs.at(-1) || null;
  let start = after ? nextWork(fin(after)+1) : p.start; if (start>fin(p)) start = p.start;
  const room = Math.max(1, workCount(start, fin(p)));
  const t = {id:uid(), name:"", phase:p.phase, start, dur:Math.min(3,room), ms:false, deps:[], owner:"", progress:0, parent:p.id, collapsed:false};
  const i = S.tasks.indexOf(after || p)+1; S.tasks.splice(i,0,t);
  p.collapsed = false; p.ms = false; return t;
}
function addTask(){ const tops=S.tasks.filter(t=>!t.parent); const t = newTaskAfter(tops.at(-1)); selId=t.id; renderAll("name:"+t.id); }
function addSub(id){ const p=byId(id); if (!p) return; const t=newSubAfter(p); selId=t.id; renderAll("name:"+t.id); }
function addPhase(){
  const names = new Set(S.tasks.map(t=>t.phase)); let nm=T("newPhase"), i=2;
  while (names.has(nm)) nm = T("newPhase")+" "+(i++);
  const last = S.tasks.filter(t=>!t.parent).at(-1);
  const t = newTaskAfter(last, nm); S.tasks.splice(S.tasks.indexOf(t),1); S.tasks.push(t);
  selId=t.id; renderAll("name:"+t.id);
}
function deleteTask(id){
  const t0 = byId(id); if (!t0) return;
  const snap = JSON.stringify(S.tasks), kids = kidsOf(id).length;
  const gone = new Set([id, ...kidsOf(id).map(c=>c.id)]);
  const order = L ? L.rows.filter(r=>r.type==="task").map(r=>r.t.id) : S.tasks.map(t=>t.id);
  const at = order.indexOf(id);
  const next = order.slice(at+1).find(x=>!gone.has(x)) || order.slice(0,Math.max(0,at)).reverse().find(x=>!gone.has(x)) || null;
  S.tasks = S.tasks.filter(t=>!gone.has(t.id));
  for (const t of S.tasks) t.deps = t.deps.filter(d=>!gone.has(d.id));
  if (selId===id || gone.has(selId)) selId = next;
  renderAll();
  toast(T("deletedMsg")(t0.name||T(t0.parent?"newSub":"newTask"), kids), {label:T("undo"), run(){ S.tasks = JSON.parse(snap); selId = id; renderAll(); }});
}
function maxKidFin(t){ let mx=-Infinity; for (const c of kidsOf(t.id)) mx=Math.max(mx,fin(c)); return mx; }
function handleField(el){
  const [f, id] = [el.dataset.f.slice(0, el.dataset.f.indexOf(":")), el.dataset.f.slice(el.dataset.f.indexOf(":")+1)];
  if (f==="phase"){ const nv = el.value.trim(); if (nv && nv!==id) for (const t of S.tasks) if (t.phase===id) t.phase=nv; return; }
  const t = byId(id); if (!t) return;
  const v = el.value;
  switch(f){
    case "name": case "tname": t.name = v; break;
    case "tphase": if (!t.parent) t.phase = v.trim(); break;
    case "tstart": { const dn = parseDate(v); if (dn!=null) { const info = moveActivity(t, dn, kidOffsets(t)); if (info) toast(infoText(info)); } break; }
    case "tdur": {
      let n=parseInt(v);
      if (!(n>=1)) break;
      if (t.ms) t.ms = false;
      const mk = maxKidFin(t);
      if (mk>-Infinity && addWork(t.start,n-1)<mk){ n = workCount(t.start,mk); toast(T("kidsLimit")(kidsOf(t.id).find(c=>fin(c)===mk).name||T("newSub"))); }
      if (t.parent){ const pf=fin(byId(t.parent)); if (addWork(t.start,n-1)>pf){ n=Math.max(1,workCount(t.start,pf)); toast(T("within")(byId(t.parent).name||T("newTask"))); } }
      t.dur=n; break;
    }
    case "tms": if (!kidsOf(t.id).length) t.ms = el.checked; break;
    case "towner": t.owner = v.trim(); break;
    case "tdeliv": t.deliv = v.trim(); break;
    case "tagreed": { const dn = parseDate(v); t.agreed = dn!=null ? nextWork(dn) : null; break; }
    case "tprog": t.progress = Math.max(0,Math.min(100,parseInt(v)||0)); break;
    case "tafter": {
      const inv = new Map([...L.num].map(([k,n])=>[String(n),k])); const deps=[];
      const D = t.start; t.deps = [];
      for (const part of v.split(/[,;\s]+/)){
        const m = part.trim().match(/^(\d+(?:\.\d+)?)(?:\+(\d+))?$/); if (!m) continue;
        const sid = inv.get(m[1]); const src = sid && byId(sid);
        if (!src || src.id===t.id || deps.some(d=>d.id===src.id)) continue;
        t.deps = deps; if (wouldCycle(src, t)) { toast(T("cycle")); continue; }
        deps.push({id:src.id, lag: m[2]?+m[2]:0});
      }
      t.deps = deps; if (deps.length && !deps.some(d=>d.lag)) setStart(t, D); break;
    }
  }
}
function infoText(info){
  const n = (info.by && info.by.name) || T("newTask");
  return info.kind==="dep" ? T("waitsFor")(n) : info.kind==="kids" ? T("kidsLimit")(n) : T("within")(n);
}

/* ---------- events ---------- */
document.addEventListener("change", e=>{
  const el=e.target;
  if (el.id==="title"){ S.title=el.value.trim(); save(); paintChrome(); return; }
  if (el.dataset && el.dataset.adddep){ const t=byId(el.dataset.adddep), src=byId(el.value); if (t && src) addDep(src,t); renderAll(); return; }
  if (el.dataset && el.dataset.f){ handleField(el); if (el.isConnected) queue(); else save(); }
});
document.addEventListener("keydown", e=>{
  const el=e.target;
  if (e.key==="Escape"){ const hadOv = document.querySelector(".ov.open, .menu.open"); closeMenus(); document.querySelectorAll(".ov.open").forEach(o=>o.classList.remove("open")); if (!hadOv && selId){ selId=null; renderAll(); } return; }
  if (e.altKey && (e.key==="ArrowUp" || e.key==="ArrowDown") && selId && !document.querySelector(".ov.open")){ e.preventDefault(); const t=byId(selId); if (t){ if (el && el.dataset && el.dataset.f) handleField(el); moveByKey(t, e.key==="ArrowUp"?-1:1); } return; }
  const editing = el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.tagName==="SELECT" || el.isContentEditable);
  if ((e.key==="Delete" || e.key==="Backspace") && !editing && selId && !document.querySelector(".ov.open")){ e.preventDefault(); deleteTask(selId); return; }
  if (e.key!=="Enter" || !el.dataset || !el.dataset.f || el.type==="checkbox") return;
  const k=el.dataset.f, f=k.slice(0,k.indexOf(":")), id=k.slice(k.indexOf(":")+1);
  e.preventDefault();
  if (f==="name"){ handleField(el); const cur=byId(id); const t = cur.parent ? newSubAfter(byId(cur.parent), cur) : newTaskAfter(cur); selId=t.id; renderAll("name:"+t.id); return; }
  if (el.closest("#panel")){ handleField(el); renderAll(); return; }
  if (f==="phase"){ el.blur(); return; }
  handleField(el);
  const ids = S.tasks.map(t=>t.id); const nxt = ids[ids.indexOf(id)+1];
  renderAll(nxt ? f+":"+nxt : null);
});
$("title").addEventListener("keydown", e=>{ if (e.key==="Enter") e.target.blur(); });
document.addEventListener("click", e=>{
  const a = e.target.closest("[data-act]");
  if (a){ if (a.dataset.act==="addTask") addTask(); else addPhase(); return; }
  const d = e.target.closest("[data-del]"); if (d){ deleteTask(d.dataset.del); return; }
  const as = e.target.closest("[data-addsub]"); if (as){ addSub(as.dataset.addsub); return; }
  const ai = e.target.closest("[data-addin]"); if (ai){ const ph=ai.dataset.addin; const ref=S.tasks.filter(t=>!t.parent && t.phase===ph).at(-1); const t=newTaskAfter(ref, ph); selId=t.id; renderAll("name:"+t.id); return; }
  const aa = e.target.closest("[data-addafter]"); if (aa){ const cur=byId(aa.dataset.addafter); if (cur){ const t = cur.parent ? newSubAfter(byId(cur.parent), cur) : newTaskAfter(cur); selId=t.id; renderAll("name:"+t.id); } return; }
  if (e.target.closest("[data-desel]")){ selId=null; renderAll(); return; }
  if (e.target.closest("[data-ptoggle]")){ S.panelOpen=!S.panelOpen; renderAll(); const f=$("panel").querySelector("[data-ptoggle]"); if (f) f.focus(); return; }
  const ud = e.target.closest("[data-undep]"); if (ud){ const [tid,pid]=ud.dataset.undep.split("|"); const t=byId(tid); if (t){ t.deps=t.deps.filter(d=>d.id!==pid); renderAll(); } return; }
  const ag = e.target.closest("[data-agree]"); if (ag){ const t=byId(ag.dataset.agree); if (t){ t.agreed = t.agreed==null ? t.start : null; renderAll(); } return; }
  const tg = e.target.closest("[data-toggle]"); if (tg){ const t=byId(tg.dataset.toggle); if (t){ t.collapsed=!t.collapsed; renderAll(); } return; }
  const mb = e.target.closest("[data-menu]");
  if (mb){ const m=$(mb.dataset.menu); const open=!m.classList.contains("open"); closeMenus(); if (open){ m.classList.add("open"); mb.setAttribute("aria-expanded","true"); } return; }
  if (!e.target.closest(".menu")) closeMenus();
  const z = e.target.closest("[data-zoom]"); if (z){ S.zoom=z.dataset.zoom; renderAll(); return; }
  const lg = e.target.closest("[data-lang]"); if (lg){ S.lang=lg.dataset.lang; renderAll(); return; }
  const ex = e.target.closest("[data-export]"); if (ex){ closeMenus(); doExport(ex.dataset.export); return; }
  if (e.target.closest("[data-close]")) e.target.closest(".ov").classList.remove("open");
  const sr = e.target.closest(".lr[data-sel]"); if (sr && !e.target.closest("button")) select(sr.dataset.sel);
});

/* feedback: composes a mail in the user's own mail app; H8XL itself sends nothing */

/* ---------- reordering rows ---------- */
function blockOf(t){ return t.parent ? [t] : [t, ...kidsOf(t.id)]; }
// possible drop positions for task t, ordered top to bottom
function rowSlots(t){
  const slots=[];
  if (t.parent){
    const sibRows = L.rows.filter(r=>r.type==="task" && r.t.parent===t.parent);
    for (const r of sibRows) slots.push({y:r.y, before:r.t.id, phase:t.phase});
    const last = sibRows.at(-1); if (last) slots.push({y:last.y+last.h, before:null, endParent:t.parent, phase:t.phase});
    return slots;
  }
  let groupEnd=null, cur=undefined;
  const flush = () => { if (groupEnd) slots.push(groupEnd); groupEnd=null; };
  for (const r of L.rows){
    if (r.type==="phase"){ flush(); cur=r.name; continue; }
    if (r.t.parent){ if (groupEnd) groupEnd.y = r.y+r.h; continue; }
    if (cur===undefined || r.t.phase!==cur){ flush(); cur=r.t.phase; }
    slots.push({y:r.y, before:r.t.id, phase:r.t.phase});
    groupEnd = {y:r.y+r.h, before:null, endPhase:r.t.phase, phase:r.t.phase};
  }
  flush();
  return slots;
}
function applySlot(t, slot){
  const block = blockOf(t), ids = new Set(block.map(x=>x.id));
  if (slot.before && ids.has(slot.before)) return false;
  const rest = S.tasks.filter(x=>!ids.has(x.id));
  let at;
  if (slot.before) at = rest.findIndex(x=>x.id===slot.before);
  else if (slot.endParent){ const sib = rest.filter(x=>x.parent===slot.endParent); at = sib.length ? rest.indexOf(sib.at(-1))+1 : rest.findIndex(x=>x.id===slot.endParent)+1; }
  else { let last=-1; rest.forEach((x,i)=>{ if (x.phase===slot.endPhase) last=i; }); at = last+1; }
  if (at<0) at = rest.length;
  const before = S.tasks.map(x=>x.id).join();
  const oldPhase = t.phase;
  rest.splice(at, 0, ...block);
  S.tasks = rest;
  if (!t.parent) t.phase = slot.phase;
  return before!==S.tasks.map(x=>x.id).join() || oldPhase!==t.phase;
}
function moveRow(t, slot){

}
function moveByKey(t, dir){

/* ---------- import ---------- */
const ALIAS = [
  ["nr",/^(nr|#|no|id|nummer|number)\.?$/],
  ["ms",/^(mijlpaal|milestone)/],
  ["agreed",/^(afgesproken|agreed|toegezegd|deadline|committed)/],
  ["deliv",/^(levert op|delivers|deliverable|oplevering|resultaat|result)/],
  ["phase",/^(fase|phase|groep|group|onderdeel)/],
  ["name",/^(taak|task|naam|name|activiteit|activity|omschrijving|description)/],
  ["start",/^(start|begin|startdatum|start date|van|from)/],
  ["end",/^(eind|einde|end|finish|einddatum|end date|tot|to)$|^(eind|einde|end|finish)/],
  ["dur",/(duur|duration|werkdagen|workdays|dagen|days)/],
  ["after",/^(na|after|voorganger|predecessors?|afhankelijk|depends)/],
  ["owner",/^(eigenaar|owner|wie|who|verantwoordelijke|responsible)/],
  ["progress",/^(voortgang|progress|%|gereed|complete)/]
];
function detectHeader(row){
  const map={}; let hits=0;
  row.forEach((c,i)=>{ const s=String(c??"").trim().toLowerCase(); if (!s) return;
    for (const [k,re] of ALIAS) if (map[k]==null && re.test(s)){ map[k]=i; hits++; break; } });
  return (map.name!=null && hits>=2) ? map : null;
}
function parseDate(v){
  if (v==null || v==="") return null;
  if (v instanceof Date && !isNaN(v)) return dnOf(v.getFullYear(), v.getMonth()+1, v.getDate());
  if (typeof v==="number") return (v>20000 && v<90000) ? Math.floor(v)-25569 : null;
  const s=String(v).trim(); let m;
  if ((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return dnOf(+m[1],+m[2],+m[3]);
  if ((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){ let y=+m[3]; if (y<100) y+=2000; return dnOf(y,+m[2],+m[1]); }
  if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(parseFloat(s));
  return null;
}
function rowsToTasks(aoa){
  aoa = aoa.filter(r=>Array.isArray(r) && r.some(c=>String(c??"").trim()!==""));
  if (!aoa.length) return null;
  let map = detectHeader(aoa[0]), rows;
  if (map) rows = aoa.slice(1);
  else { rows = aoa; const n = Math.max(...aoa.map(r=>r.length)); map = n>=4 ? {phase:0,name:1,start:2,end:3} : {name:0,start:1,end:2}; }
  const out=[], nr=new Map(), pending=[];
  const cell = (r,k) => map[k]!=null ? r[map[k]] : "";
  for (const r of rows){
    const name = String(cell(r,"name")??"").trim();
    const st = parseDate(cell(r,"start")), en = parseDate(cell(r,"end"));
    if (!name && st==null) continue;
    const msRaw = String(cell(r,"ms")??"").trim();
    const durRaw = cell(r,"dur"); const durN = durRaw===""||durRaw==null ? NaN : parseInt(durRaw);
    const ms = /^(ja|yes|y|j|1|true|waar|x|✓|◆)$/i.test(msRaw) || durN===0;
    const prev = out.at(-1);
    let s = st!=null ? st : (en!=null ? en : (prev ? nextWork(fin(prev)+1) : nextWork(todayDn())));
    s = nextWork(s);
    let dur = durN>=1 ? durN : (en!=null && en>=s ? Math.max(1, workCount(s,en)) : (ms?1:5));
    let prog = cell(r,"progress"); if (typeof prog==="number" && prog>0 && prog<=1) prog*=100; prog = parseFloat(String(prog??"").replace("%","").replace(",","."))||0;
    const t = {id:uid(), name, phase:String(cell(r,"phase")??"").trim(), start:s, dur, ms, deps:[], owner:String(cell(r,"owner")??"").trim(), progress:Math.max(0,Math.min(100,Math.round(prog))), parent:null, collapsed:false, deliv:String(cell(r,"deliv")??"").trim(), agreed:parseDate(cell(r,"agreed"))};
    const key = map.nr!=null && String(r[map.nr]??"").trim()!=="" ? String(r[map.nr]).trim() : String(out.length+1);

  }
  return out.length ? out : null;
}

    for (const d of all){ const p=byId(d.id); if (p && !wouldCycle(p,t)) { keep.push(d); t.deps=keep.slice(); } }

}

/* ---------- zip (store) + crc32 ---------- */
const CRC_T = (()=>{ const t=new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

      const yy = y + r.h/2 + 4.5, ix = r.sub ? 16 : 0;
      s += `<text x="${pad+30+ix}" y="${yy}" font-size="11" text-anchor="end" fill="${c.muted}">${r.n}</text>`;
      s += `<text x="${pad+40+ix}" y="${yy}" font-size="${r.sub?12:13}" fill="${r.sub?c.muted:c.ink}"${r.t.ms||r.kids?' font-weight="600"':""}>${esc(trunc(r.t.name||T(r.sub?"newSub":"newTask"),r.sub?28:30))}</text>`;
    }
    s += `<line x1="${pad}" y1="${y+r.h-.5}" x2="${X0}" y2="${y+r.h-.5}" stroke="${c.line}"/>`;
  }
  s += `<line x1="${X0+.5}" y1="${Y0}" x2="${X0+.5}" y2="${Y0+hdrH+rowsH}" stroke="${c.line}"/>`;
  if (dRows.length){
    let y = Y0+hdrH+rowsH+48;
    s += `<text x="${pad}" y="${y}" font-size="16" font-weight="700" fill="${c.ink}">${esc(T("deliveries"))}</text>`;
    const cols=[[pad,T("milestone")],[pad+200,T("deliv")],[pad+470,T("expected")],[pad+580,T("agreed")],[pad+690,T("gap")]];
    y += 26;
    for (const [x,h] of cols) s += `<text x="${x}" y="${y}" font-size="11.5" fill="${c.muted}">${esc(h)}</text>`;
    s += `<line x1="${pad}" y1="${y+8.5}" x2="${W-pad}" y2="${y+8.5}" stroke="${c["line-strong"]}"/>`;
    const fd = d => fmt(d,{day:"numeric",month:"short",year:"numeric"});
    for (const t of dRows){
      y += 28; const g = gapInfo(t);
      const vals=[trunc(t.name||T("newTask"),26), trunc(t.deliv||"–",38), fd(t.start), t.agreed!=null?fd(t.agreed):"–", g?T("gapLong")[g.k](g.n):"–"];
      vals.forEach((v,i)=>{ s += `<text x="${cols[i][0]}" y="${y}" font-size="12.5" fill="${c.ink}"${i===4&&g&&g.k==="over"?' font-weight="700"':""}>${esc(v)}</text>`; });
      s += `<line x1="${pad}" y1="${y+9.5}" x2="${W-pad}" y2="${y+9.5}" stroke="${c.line}"/>`;
    }
  }
  s += `<text x="${W-pad}" y="${H-pad+6}" font-size="11.5" text-anchor="end" fill="${c.muted}">${esc(T("madeWith"))}</text>`;
  s += `</svg>`;
  return {svg:s, W, H};
}
function svgToCanvas(svg, W, H){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      let sc = 2; const lim=14000; if (W*sc>lim || H*sc>lim) sc = Math.max(.5, Math.min(lim/W, lim/H));
      const cv=document.createElement("canvas"); cv.width=Math.round(W*sc); cv.height=Math.round(H*sc);
      const x=cv.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height); x.scale(sc,sc); x.drawImage(img,0,0,W,H); res(cv);
    };
    img.onerror = rej;
    img.src = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}
const toBlob = cv => new Promise(r=>cv.toBlob(r,"image/png"));
async function doExport(kind){
  const name = slug(S.title||T("untitled"));
  try {
    if (kind==="xlsx"){ await saveFile(name+".xlsx", buildXlsx()); }
    else {
      const {svg,W,H} = buildExportSVG(); const cv = await svgToCanvas(svg,W,H);
      if (kind==="png"){ await saveFile(name+".png", await toBlob(cv)); }
      else {
        const jpeg = new Uint8Array(await (await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92))).arrayBuffer());
        const ratio = W/H, big = (W>1900||H>1250);
        let PW = big?1191:842, PH = big?842:595; if (ratio<1){ const t=PW; PW=PH; PH=t; }
        const m=28; let w=PW-2*m, h=w/ratio; if (h>PH-2*m){ h=PH-2*m; w=h*ratio; }
        await saveFile(name+".pdf", buildPdf(jpeg, cv.width, cv.height, PW, PH, (PW-w)/2, PH-m-h, w, h, S.title||T("untitled")));
      }
    }
    renderAll();
  } catch(err){ console.error(err); toast(T("exportFail")); }
}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg, action){
  const el=$("toast"); el.textContent=msg; el.classList.toggle("act", !!action);
  if (action){ const b=document.createElement("button"); b.className="toast-act"; b.textContent=action.label; b.addEventListener("click", ()=>{ clearTimeout(toastT); el.classList.remove("show","act"); action.run(); }); el.appendChild(b); }
  el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show","act"), action?7000:3600);
}

/* ---------- start ---------- */
load();
renderAll();
})();
</script>
